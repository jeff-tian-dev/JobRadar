[project]
name = "jobradar"
version = "0.1.0"
description = "Local job search pipeline: RSS feed monitoring, company discovery, score with ollama, dashboard, alerts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=5.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "ollama>=0.4",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "anyio>=4.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "playwright>=1.49",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"

[tool.setuptools]
packages = ["pipeline", "feeds", "discovery"]
